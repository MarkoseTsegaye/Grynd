<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grynd app icon">
  <!-- App icon: lime 'G' formed as a barbell collar, on near-black rounded tile -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141416"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- barbell -->
  <g stroke="#d8f24e" stroke-linecap="round" fill="none">
    <line x1="150" y1="256" x2="362" y2="256" stroke-width="26"/>
    <!-- left plates -->
    <line x1="150" y1="200" x2="150" y2="312" stroke-width="34"/>
    <line x1="112" y1="216" x2="112" y2="296" stroke-width="34"/>
    <!-- right plates -->
    <line x1="362" y1="200" x2="362" y2="312" stroke-width="34"/>
    <line x1="400" y1="216" x2="400" y2="296" stroke-width="34"/>
  </g>
  <!-- 'G' ring cue overlapping the bar center -->
  <path d="M256 176a80 80 0 1 0 78 96h-70" fill="none" stroke="#d8f24e" stroke-width="26" stroke-linecap="round"/>
</svg>
